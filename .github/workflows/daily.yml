name: daily-update

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 北京时间 工作日 18:40
    - cron: "10 13 * * 1-5"   # 北京时间 21:10 再跑一次，补上当天晚发布的份额数据
  workflow_dispatch:
    inputs:
      backfill:
        description: "回补最近N个交易日（首次运行填250）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        env:
          TZ: Asia/Shanghai
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            ARGS="--backfill ${{ github.event.inputs.backfill }}"
          elif [ ! -f data/monitor.db ]; then
            ARGS="--backfill 250"
          fi
          mkdir -p logs
          set -o pipefail
          python -u diagnose.py 2>&1 | tee logs/last_run.log || true
          python -u run_daily.py $ARGS 2>&1 | tee -a logs/last_run.log

      - name: Save log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs/last_run.log data 2>/dev/null || true
          git commit -m "log: $(TZ=Asia/Shanghai date '+%F %T')" || echo "no changes"
          git pull --rebase -X theirs origin main || true
          git push || true

      - name: Build site
        run: |
          mkdir -p site
          cp reports/latest.html site/index.html
          mkdir -p site/archive && cp reports/20*.html site/archive/ 2>/dev/null || true
          cp data/signals.csv site/signals.csv 2>/dev/null || true
          cp data/holding_cap.csv site/holding_cap.csv 2>/dev/null || true

      - name: Save data
        run: |
          git add data reports
          git commit -m "data: $(TZ=Asia/Shanghai date +%F)" || echo "no changes"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
